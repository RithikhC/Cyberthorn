<text x="350" y="206" font-size="26" fill="#5d6670" text-anchor="middle">independent hardware limiter</text>
<path d="M350 226 V250" stroke="#1b2024" stroke-width="5"/><path d="M337 240 L350 256 L363 240" fill="#1b2024"/><text x="376" y="249" font-size="24" fill="#1b2024">telemetry / enforce</text>
